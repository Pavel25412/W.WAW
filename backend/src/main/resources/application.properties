spring.application.name=wwaw-backend
server.port=8080

# In-memory H2 database - data is re-created (and re-seeded) on every start
spring.datasource.url=jdbc:h2:mem:wwaw;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# CORS - origins of the static frontend (any port on localhost)
wwaw.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Delay journal: a report is removed automatically this many days after it was created
wwaw.delays.retention-days=30
# Cleanup job schedule (Spring cron, Europe/Warsaw): every day at 03:00
wwaw.delays.cleanup-cron=0 0 3 * * *
